name: Update fe-news submodule

on:
  schedule:
    # fe-news publishes on the 1st-7th, 01:00-11:00 UTC; days 1-10 also catch follow-up fixes
    - cron: "0 15 1-10 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: git submodule update --remote src/fe-news
      - run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update fe-news submodule to $(git -C src/fe-news rev-parse --short HEAD)"
          git push
